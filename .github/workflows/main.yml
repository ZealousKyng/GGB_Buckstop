name: API Testing

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    branches:
      - '**'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Debug - Show repository structure
        run: |
          echo "=== Repository root contents ==="
          ls -la
          echo ""
          echo "=== Looking for BucStop project ==="
          find . -name "*.csproj" -type f
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Restore dependencies - adjust path based on actual structure
      - name: Restore dependencies
        run: dotnet restore
      
      # Build your API
      - name: Build API
        run: dotnet build --configuration Release --no-restore
      
      # Start your API server in the background
      - name: Start BucStop API Server
        run: |
          # Find the BucStop.dll file
          DLL_PATH=$(find . -name "BucStop.dll" -path "*/bin/Release/*" | head -1)
          if [ -z "$DLL_PATH" ]; then
            echo "Error: BucStop.dll not found"
            exit 1
          fi
          
          echo "Starting API from: $DLL_PATH"
          dotnet "$DLL_PATH" --urls "http://0.0.0.0:5230" &
          echo $! > api_pid.txt
          
          # Wait for API to be ready
          echo "Waiting for BucStop API to start..."
          for i in {1..30}; do
            if curl -s http://localhost:5230/ > /dev/null 2>&1; then
              echo "BucStop API is up and running!"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
        env:
          ASPNETCORE_ENVIRONMENT: Development
      
      # Test main endpoints
      - name: Test Main API Endpoints
        run: |
          echo "Testing main BucStop endpoints..."
          
          # Test home page
          echo "Testing Home (/)..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5230/)
          if [ $response -eq 200 ]; then
            echo "✅ Home endpoint OK (Status: $response)"
          else
            echo "❌ Home endpoint failed (Status: $response)"
            exit 1
          fi
          
          # Test Games endpoint
          echo "Testing Games (/Games)..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5230/Games)
          if [ $response -eq 200 ]; then
            echo "✅ Games endpoint OK (Status: $response)"
          else
            echo "❌ Games endpoint failed (Status: $response)"
            exit 1
          fi
      
      # Validate OpenAPI spec if it exists
      - name: Validate OpenAPI Specification
        run: |
          npm install -g @apidevtools/swagger-cli
          
          if [ -f "openapi.json" ]; then
            echo "Validating OpenAPI specification..."
            swagger-cli validate "openapi.json"
          else
            echo "No OpenAPI file found, skipping validation"
          fi
        continue-on-error: true
      
      # Check API response times
      - name: API Performance Check
        run: |
          echo "Checking API response times..."
          
          TIME=$(curl -o /dev/null -s -w '%{time_total}\n' http://localhost:5230/)
          echo "Home page response time: ${TIME}s"
          
          TIME=$(curl -o /dev/null -s -w '%{time_total}\n' http://localhost:5230/Games)
          echo "Games page response time: ${TIME}s"
        continue-on-error: true
      
      # Test Swagger endpoint
      - name: Test Swagger Documentation
        run: |
          echo "Testing Swagger endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5230/swagger/v1/swagger.json)
          if [ $response -eq 200 ]; then
            echo "✅ Swagger endpoint OK (Status: $response)"
          else
            echo "⚠️ Swagger endpoint not available (Status: $response)"
          fi
        continue-on-error: true
      
      # Stop API server
      - name: Stop API Server
        if: always()
        run: |
          if [ -f api_pid.txt ]; then
            echo "Stopping BucStop API..."
            kill $(cat api_pid.txt) || true
            sleep 2
            kill -9 $(cat api_pid.txt) 2>/dev/null || true
          fi
      
      # Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            **/TestResults/**
            **/*.trx
            **/*.log
          if-no-files-found: ignore
