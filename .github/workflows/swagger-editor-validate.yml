name: Swagger Editor Validate

on:
  push:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'

jobs:
  swagger-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
